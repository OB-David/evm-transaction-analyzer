[project]
name = "evm-cfg-py"
version = "0.1.0"
description = "Creating Control Flow Graph (CFG) for Ethereum Smart Contract and Transaction execution path"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "matplotlib>=3.10.8",
    "pyevmasm",
    "python-dotenv>=1.1.1",
    "web3>=7.13.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "flask>=3.1.3",
    "plotly>=6.6.0",
    "flask-cors>=6.0.2",
]

[tool.uv.sources]
pyevmasm = { git = "https://github.com/crytic/pyevmasm" }
